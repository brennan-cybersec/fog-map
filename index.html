<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the layout use env(safe-area-inset-*) so the HUD
      clears the notch and the Android gesture bar. user-scalable=no is
      deliberate here and only here: the map has its own pinch-to-zoom, and
      browser page-zoom on top of it makes the map impossible to control.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f12" />
    <meta
      name="description"
      content="A map of your life — and the world you still haven't seen. Territory you have actually visited is revealed; everywhere else stays a pale survey map."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terra" />

    <title>Terra Incognita</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
